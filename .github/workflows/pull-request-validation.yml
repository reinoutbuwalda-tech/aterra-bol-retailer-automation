name: pull-request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux:
    name: Linux required release gate (Node 22.20.0)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16.10, pinned to the multi-platform OCI index digest.
        image: postgres@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
        env:
          POSTGRES_DB: retailer_migration_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retailer_migration_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RETAILER_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retailer_migration_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=critical

  verify-windows:
    name: Windows unit gate (Node 24.10.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.10.0
          cache: npm
      - run: npm ci
      - run: npm run verify:unit
      - run: npm audit --audit-level=critical

  edge-function-check:
    name: Deno Edge Function check (Deno 2.9.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.7
      - run: deno check --no-lock --node-modules-dir=auto supabase/functions/bol-retailer-transform/index.ts

  full-chain-migration:
    name: Full Supabase migration chain and real pgmq cutover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Apply every migration preceding retailer transform v2
        shell: bash
        run: |
          cp tests/fixtures/supabase-product-master-prerequisite.sql supabase/migrations/20260801000000_test_product_master_prerequisite.sql
          cp tests/fixtures/supabase-historical-foundation-prerequisite.sql supabase/migrations/20260929160000_test_historical_foundation_prerequisite.sql
          cp supabase/migrations/20260930155322_retailer_transform_v2_contract.sql "$RUNNER_TEMP/retailer_transform_v2_contract.sql"
          rm supabase/migrations/20260930155322_retailer_transform_v2_contract.sql
          supabase init --force
          supabase start
          supabase db reset --local --no-seed
      - name: Execute v2 against the real preceding chain with real pgmq
        env:
          RETAILER_FULL_CHAIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          RETAILER_V2_MIGRATION_PATH: ${{ runner.temp }}/retailer_transform_v2_contract.sql
        run: npm run test:migration:full-chain
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
