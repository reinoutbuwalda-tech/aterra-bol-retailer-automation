name: pull-request validation

on:
  pull_request:
  push:
    branches:
      - codex/self-contained-retailer-tests

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.20.0
          - os: windows-latest
            node: 24.10.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=critical

  migration-integration:
    name: PostgreSQL migration behavior
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: retailer_migration_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retailer_migration_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RETAILER_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retailer_migration_ci
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run test:migration
